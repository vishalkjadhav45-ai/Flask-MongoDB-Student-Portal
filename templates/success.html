<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #101b35, #173b70, #1765a5);
        }

        .success-card {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 48px 32px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, .25);
            animation: appear .6s ease;
        }

        .check-circle {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #e5f8ee;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pop .5s ease .2s both;
        }

        .checkmark {
            width: 29px;
            height: 49px;
            border-right: 6px solid #16a05d;
            border-bottom: 6px solid #16a05d;
            transform: rotate(45deg) scale(0);
            animation: draw .4s ease .65s forwards;
            margin-top: -9px;
        }

        h1 {
            color: #172b4d;
            font-size: 25px;
            margin-bottom: 12px;
        }

        .message {
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .status {
            display: inline-block;
            background: #e8f8ef;
            color: #16834e;
            padding: 7px 15px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 27px;
        }

        .home-btn {
            display: inline-block;
            background: linear-gradient(100deg, #1765c0, #2788e8);
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            transition: .25s ease;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 16px rgba(23, 101, 192, .25);
        }

        .footer {
            color: #94a3b8;
            font-size: 11px;
            margin-top: 30px;
        }

        @keyframes pop {
            from { transform: scale(.3); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes draw {
            to { transform: rotate(45deg) scale(1); }
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="check-circle">
            <div class="checkmark"></div>
        </div>

        <div class="status">✓ Submission Completed</div>

        <h1>Data submitted successfully!</h1>

        <p class="message">
            Your information has been received and saved successfully.
            Thank you for completing the submission.
        </p>

        <a href="/" class="home-btn">← Back to Home</a>

        <div class="footer">
            Powered by Flask & MongoDB
        </div>

    </div>

</body>
</html>
